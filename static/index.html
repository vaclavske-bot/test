<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Private Label Finder</title>
<style>
:root{--bg:#fafaf7;--fg:#1d2420;--mut:#667;--card:#fff;--br:#dde;--ok:#1b7f3b;--warn:#b26b00;--bad:#b3261e;--acc:#0b5d4b}
@media(prefers-color-scheme:dark){:root{--bg:#141816;--fg:#e8ece9;--mut:#9aa;--card:#1d2420;--br:#33403a;--acc:#5fd1b3}}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:860px;margin:0 auto;padding:16px}h1{font-size:1.3rem;margin:.2em 0}
.row{display:flex;gap:8px;flex-wrap:wrap}input,select,textarea,button{font:inherit;padding:9px;border:1px solid var(--br);border-radius:8px;background:var(--card);color:var(--fg)}
input,textarea{flex:1;min-width:140px}button{cursor:pointer;background:var(--acc);color:#fff;border:0}button.sec{background:var(--card);color:var(--fg);border:1px solid var(--br)}
.card{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:12px;margin:10px 0}
.b{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.8rem;color:#fff}.ok{background:var(--ok)}.warn{background:var(--warn)}.bad{background:var(--bad)}.neu{background:#667}
table{width:100%;border-collapse:collapse}td,th{padding:5px;border-bottom:1px solid var(--br);text-align:left;vertical-align:top;font-size:.92rem}
.mut{color:var(--mut);font-size:.88rem}video{width:100%;max-height:260px;border-radius:10px;background:#000}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}label{font-size:.82rem;color:var(--mut);display:block}
.diff{background:rgba(178,107,0,.15)}a{color:var(--acc)}
</style></head><body><main>
<h1>🛒 Private Label Finder</h1>
<p class="mut">Chi produce davvero il prodotto che stai per comprare? Cerca per nome, marchio, insegna, produttore o codice a barre.</p>
<div class="row"><input id="q" placeholder="es. latte Conad bio, Granarolo, 8001234567890…" autofocus>
<button onclick="doSearch()">Cerca</button><button class="sec" onclick="scan()">📷 Scansiona</button></div>
<video id="v" hidden playsinline></video><div id="msg" class="mut"></div>
<div id="res"></div><div id="cmp"></div><div id="add"></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'—').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const api=(p,o)=>fetch(p,o).then(r=>r.json());
const ORI={italia:['🇮🇹 Materia prima italiana','ok'],ue:['🇪🇺 Materia prima UE','warn'],extra_ue:['🌍 Materia prima extra-UE','bad'],misto:['Origine mista UE/non UE','warn'],non_dichiarata:['Origine materia prima non dichiarata','neu']};
const VER={verificato:['✔ verificato (fonte)','ok'],da_verificare:['⚠ da verificare','warn'],segnalato_utente:['segnalato da utente','neu']};
const badge=([t,c])=>`<span class="b ${c}">${t}</span>`;
let last='';
async function doSearch(code){const q=code||$('q').value.trim();if(!q)return;last=q;$('cmp').innerHTML='';
 const r=await api('/api/search?q='+encodeURIComponent(q));
 $('res').innerHTML=r.map(p=>`<div class="card"><b>${esc(p.brand)} ${esc(p.line||'')}</b> — ${esc(p.name)}
 <div class="mut">${esc(p.retailer)} · ${p.is_private_label?'Private label':'Marchio industriale'} · ${esc(p.size)}${p.price_eur?` · €${p.price_eur}`:''}</div>
 <div>${badge(ORI[p.origin_status]||ORI.non_dichiarata)} ${badge(VER[p.verification]||VER.da_verificare)}</div>
 <div>Produttore: <b>${esc(p.manufacturer)}</b> ${p.plant_code?`(bollo ${esc(p.plant_code)})`:''}</div>
 ${p.plant?`<div class="mut">🏭 Stabilimento (registro Min. Salute): <b>${esc(p.plant.name)}</b> — ${esc(p.plant.address)} · P.IVA ${esc(p.plant.vat)}</div>`:(p.plant_code?'<div class="mut">Bollo non trovato nel registro caricato.</div>':'')}
 ${p.fao_area?`<div>🐟 ${esc(p.species)} — zona FAO ${esc(p.fao_area)}. ${esc(p.fish_note||'')}</div>`:''}
 ${p.source_url?`<div class="mut">Fonte: <a href="${esc(p.source_url)}" target="_blank" rel="noopener">link</a> — ${esc(p.source_note)}</div>`:''}
 <button onclick="compare(${p.id})">Confronta con prodotti dello stesso produttore</button></div>`).join('')||'';
 if(!r.length){$('res').innerHTML='<div class="card">Nessun risultato. Aggiungilo: la prossima ricerca lo troverà.</div>';addForm({name:isNaN(q)?q:'',barcode:isNaN(q)?'':q});
  api('/api/missing',{method:'POST',body:JSON.stringify({query:q,barcode:isNaN(q)?null:q})});}
 else $('add').innerHTML='<button class="sec" onclick="addForm({})">+ Aggiungi un prodotto mancante</button>';}
const SEZ={0:'attività generale',1:'carni ungulati',2:'pollame e lagomorfi',3:'selvaggina allevata',4:'selvaggina selvatica',5:'carni macinate/preparazioni',6:'prodotti a base di carne',7:'molluschi bivalvi',8:'prodotti della pesca',9:'latte e latticini',10:'uova',11:'rane e lumache',12:'grassi fusi',13:'stomachi/vesciche/intestini',14:'gelatina',15:'collagene',16:'prodotti altamente raffinati'};
const LVL={stesso_stabilimento:['🟢 Stesso stabilimento','ok'],stesso_produttore:['🟡 Stesso produttore, altro stabilimento','warn'],da_confermare:['🟠 Stesso produttore, stabilimento da confermare','warn']};
const money=(v,u)=>v==null?null:'€'+v+(u?'/'+u:'');
const ROWS=[['Fabbricazione',null],
 ['Produttore',p=>p.manufacturer||(p.plant&&p.plant.name)],['P.IVA',p=>p.plant&&p.plant.vat],['Bollo CE',p=>p.plant_code],
 ['Stabilimento (registro)',p=>p.plant&&p.plant.name],['Indirizzo stabilimento',p=>(p.plant&&p.plant.address)||p.manufacturer_address],
 ['Riconosciuto per',p=>p.plant&&p.plant.sections&&p.plant.sections.split(',').map(x=>SEZ[x]||x).join(', ')],['Confezionato in',p=>p.packaged_in],
 ['Origine',null],['Materia prima',p=>(ORI[p.origin_status]||[''])[0]],['Dettaglio origine',p=>p.raw_material_origin],
 ['Prodotto',null],['Formato',p=>p.size],['Prezzo',p=>money(p.price_eur)],['Prezzo/unità',p=>money(p.price_per_unit,p.unit)],['Ingredienti',p=>p.ingredients]];
async function compare(id){const r=await api('/api/compare/'+id);const P=[r.product,...r.matches.map(m=>m.product)];
 const head=P.map((p,i)=>`<th>${i?'':'<small>(scelto)</small><br>'}${esc(p.brand)} ${esc(p.line||'')}<br><small class="mut">${esc(p.retailer)}</small></th>`).join('');
 const body=ROWS.map(([lab,f])=>{if(!f)return `<tr><th colspan=${P.length+1} style="background:var(--bg)">${lab}</th></tr>`;
  const v=P.map(p=>{const x=f(p);return x===null||x===undefined||x===''?null:String(x)});const set=new Set(v.filter(x=>x!==null));
  return `<tr class="${set.size>1?'diff':''}"><td class="mut">${lab}</td>${v.map(x=>`<td>${x===null?'<span class="mut">n.d.</span>':esc(x)}</td>`).join('')}</tr>`}).join('');
 const verd=r.matches.map(m=>`<div>${badge(LVL[m.level])} <b>${esc(m.product.brand)}</b>: ${esc(m.verdict)}${m.identical_ingredients===null?'':m.identical_ingredients?' Ingredienti identici.':' Ingredienti diversi.'}</div>`).join('');
 const oth=r.other_categories.length?`<p class="mut">Altri prodotti dello stesso produttore/stabilimento (altre categorie): ${r.other_categories.map(o=>`${esc(o.brand)} ${esc(o.name)} (${esc(o.category)})`).join('; ')}</p>`:'';
 $('cmp').innerHTML=`<div class="card"><h3>Confronto dati di fabbricazione</h3>${verd||'<div class="mut">Nessun altro prodotto della stessa categoria con produttore o stabilimento coincidente.</div>'}
 <p class="mut">Stesso stabilimento non significa stessa ricetta: le righe evidenziate sono quelle che differiscono.</p>
 <div style="overflow-x:auto"><table><tr><th></th>${head}</tr>${body}</table></div>${oth}</div>`;}
function addForm(d){const f=(k,l,t='input')=>`<div><label>${l}</label><${t} id="f_${k}" value="${esc(d[k]||'').replace('—','')}"></${t}></div>`;
 $('add').innerHTML=`<div class="card"><h3>Aggiungi prodotto</h3><div class="grid">${f('name','Nome *')}${f('barcode','Codice a barre')}${f('brand','Marchio')}${f('line','Linea (es. Verso Natura)')}${f('retailer','Supermercato')}${f('category','Categoria (es. latte)')}${f('size','Formato')}${f('price_eur','Prezzo €')}${f('price_per_unit','Prezzo/unità')}${f('unit','Unità (kg/L)')}
 ${f('manufacturer','Produttore (da etichetta: "prodotto da…")')}${f('plant_code','Bollo CE / sito (es. IT 03 74 CE)')}${f('packaged_in','Confezionato in')}${f('raw_material_origin','Origine materia prima (testo etichetta)')}
 <div><label>Origine</label><select id="f_origin_status">${Object.entries(ORI).map(([k,v])=>`<option value="${k}">${v[0]}</option>`)}</select></div>
 ${f('species','Specie (ittico)')}${f('fao_area','Zona FAO (es. 37.2)')}</div>
 <label>Ingredienti</label><textarea id="f_ingredients" rows=2></textarea><div class="row" style="margin-top:8px"><button onclick="save()">Salva</button>
 <button class="sec" onclick="importOff()">Importa da Open Food Facts (da codice a barre)</button></div></div>`;}
async function save(){const d={};document.querySelectorAll('[id^=f_]').forEach(e=>{if(e.value)d[e.id.slice(2)]=e.value});
 d.is_private_label=d.line||/conad|coop|esselunga|eurospin|lidl|top/i.test(d.brand||'')?1:0;
 ['price_eur','price_per_unit'].forEach(k=>d[k]&&(d[k]=parseFloat(String(d[k]).replace(',','.'))));
 const r=await api('/api/product',{method:'POST',body:JSON.stringify(d)});$('msg').textContent=r.error||'Salvato ✔';if(r.id){$('add').innerHTML='';doSearch(d.barcode||d.name)}}
async function importOff(){const b=$('f_barcode').value;const r=await api('/api/import-off',{method:'POST',body:JSON.stringify({barcode:b})});
 if(r.error)return $('msg').textContent='Import non riuscito: '+r.error;addForm(r);$('f_ingredients').value=r.ingredients||''}
async function scan(){if(!('BarcodeDetector' in window))return $('msg').textContent='Scanner non supportato da questo browser: digita il codice a barre (Chrome Android lo supporta).';
 const v=$('v');v.hidden=false;const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=s;await v.play();
 const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a']});
 const t=setInterval(async()=>{const c=await det.detect(v).catch(()=>[]);if(c.length){clearInterval(t);s.getTracks().forEach(x=>x.stop());v.hidden=true;$('q').value=c[0].rawValue;doSearch(c[0].rawValue)}},400)}
$('q').addEventListener('keydown',e=>e.key==='Enter'&&doSearch());
</script></main></body></html>
